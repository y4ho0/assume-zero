name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable snapshot 2026-07
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

      - name: Release build
        run: cargo build --locked --release

  msrv:
    name: MSRV (Rust 1.80.0)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable snapshot 2026-07
        with:
          toolchain: 1.80.0

      - name: Check minimum supported Rust version
        run: cargo +1.80.0 check --locked --all-targets --all-features

  schemas:
    name: JSON Schema 2020-12
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate schemas and examples
        run: ./scripts/validate-schemas.sh

  install-smoke:
    name: Install smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable snapshot 2026-07

      - name: Install from the checked-out source
        run: cargo install --path . --locked --root "${RUNNER_TEMP}/assumezero-install"

      - name: Verify installed command
        run: |
          version="$("${RUNNER_TEMP}/assumezero-install/bin/assumezero" --version)"
          test "$version" = "assumezero 0.1.0"
          "${RUNNER_TEMP}/assumezero-install/bin/assumezero" --help >/dev/null
