name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable snapshot 2026-07

      - name: Match tag, Cargo, README, and changelog versions
        env:
          ASSUMEZERO_RELEASE_TAG: ${{ github.ref_name }}
        run: cargo test --locked --test release_consistency

  build:
    name: ${{ matrix.target }}
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: x86_64-pc-windows-msvc.zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: x86_64-apple-darwin.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            suffix: aarch64-apple-darwin.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable snapshot 2026-07
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test binary
        if: runner.os != 'Windows'
        run: |
          binary="target/${{ matrix.target }}/release/assumezero"
          test "$("$binary" --version)" = "assumezero 0.1.0"
          "$binary" --help >/dev/null

      - name: Package archive
        if: runner.os != 'Windows'
        run: |
          asset="assumezero-${GITHUB_REF_NAME}-${{ matrix.suffix }}"
          stage="${RUNNER_TEMP}/assumezero-stage"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/assumezero" "$stage/"
          cp README.md LICENSE "$stage/"
          tar -czf "${RUNNER_TEMP}/${asset}" -C "$stage" assumezero README.md LICENSE
          echo "ASSET_PATH=${RUNNER_TEMP}/${asset}" >> "$GITHUB_ENV"

      - name: Smoke test binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/assumezero.exe"
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "assumezero 0.1.0") {
            throw "unexpected version output: $version"
          }
          & $binary --help *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "help command failed"
          }

      - name: Package archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "assumezero-${env:GITHUB_REF_NAME}-${{ matrix.suffix }}"
          $stage = Join-Path $env:RUNNER_TEMP "assumezero-stage"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/assumezero.exe" $stage
          Copy-Item README.md, LICENSE $stage
          Compress-Archive -Path "$stage/*" -DestinationPath (Join-Path $env:RUNNER_TEMP $asset)
          "ASSET_PATH=$(Join-Path $env:RUNNER_TEMP $asset)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload packaged archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assumezero-${{ github.ref_name }}-${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error
          retention-days: 14
